<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="portfolioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#046380;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#portfolioGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Portfolio/briefcase icon -->
  <g fill="#ffffff">
    <!-- Main briefcase body -->
    <rect x="12" y="18" width="24" height="16" rx="2" ry="2"/>
    
    <!-- Handle -->
    <rect x="20" y="14" width="8" height="4" rx="2" ry="2" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Lock/clasp -->
    <rect x="22" y="22" width="4" height="2" rx="1" ry="1"/>
    
    <!-- Side details -->
    <circle cx="16" cy="26" r="1"/>
    <circle cx="32" cy="26" r="1"/>
  </g>
</svg>